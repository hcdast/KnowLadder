<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程响应式验收</title><style>body{margin:16px;font:16px system-ui;color:#183349;background:#edf4f9}button{min-height:44px;margin:0 8px 12px 0}iframe{display:block;height:1000px;border:1px solid #9aafc0;background:white}.frame-host{overflow:auto}</style></head><body><h1>真实课程布局视口</h1><p>使用实际应用的CSS布局视口，物理设备和完整读屏另验。</p><nav><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="1280">1280px</button><button data-page="/personal?tab=courses">内容中心</button><button data-page="/personal?tab=courses&course=work-improvement&unit=handover">课程单元</button></nav><div class="frame-host"><iframe title="课程布局视口" width="320" src="/personal?tab=courses"></iframe></div><script type="module">const frame=document.querySelector('iframe');for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>frame.width=button.dataset.width);for(const button of document.querySelectorAll('[data-page]'))button.addEventListener('click',()=>frame.src=button.dataset.page);</script></body></html>
